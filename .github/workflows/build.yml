name: Desktop builds
on:
    workflow_dispatch:
    push:
        tags: ['v*']
jobs:
    build:
        strategy:
            matrix:
                os: [macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm test
            - run: npm run smoke
            - run: npm run smoke:clipboard
            - run: npm run smoke:capture
            - if: runner.os == 'macOS'
              run: npm run dist:mac -- --arm64 --x64 --publish never
              env:
                  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
            - if: runner.os == 'Windows'
              run: npm run dist:win -- --x64 --publish never
            - uses: actions/upload-artifact@v4
              with:
                  name: Lingo-${{ runner.os }}
                  path: |
                      release/*.dmg
                      release/*.zip
                      release/*.exe
